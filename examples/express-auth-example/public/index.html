<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>email-auth-kit Express Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: white; padding: 36px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
    h1 { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 8px; }
    p { font-size: 14px; color: #6b7280; margin-bottom: 24px; line-height: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="email"], input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #4f46e5; ring: 2px solid #c7d2fe; }
    .otp-input { letter-spacing: 6px; text-align: center; font-size: 24px; font-family: monospace; font-weight: 700; }
    button { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    button:hover { background: #4338ca; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .link-btn { background: none; color: #4f46e5; border: none; font-size: 13px; padding: 8px 0; margin-top: 12px; cursor: pointer; text-decoration: underline; width: auto; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div id="auth-flow">
      <h1>Sign In with Email</h1>
      <p>Enter your email to receive a secure one-time verification code.</p>

      <div id="alert-box" class="alert hidden"></div>

      <!-- Step 1: Email Form -->
      <form id="email-form">
        <label for="email">Work or Personal Email</label>
        <input type="email" id="email" required placeholder="alex@example.com" autocomplete="email" />
        <button type="submit" id="send-btn">Send One-Time Code</button>
      </form>

      <!-- Step 2: OTP Form -->
      <form id="otp-form" class="hidden">
        <label for="otp">Enter 6-digit Code</label>
        <input type="text" id="otp" maxlength="6" class="otp-input" placeholder="······" autocomplete="one-time-code" required />
        <button type="submit" id="verify-btn">Verify & Continue</button>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
          <button type="button" class="link-btn" id="change-email-btn">Change email</button>
          <button type="button" class="link-btn" id="resend-btn">Resend code</button>
        </div>
      </form>
    </div>

    <!-- Authenticated State -->
    <div id="dashboard" class="hidden">
      <h1>Welcome back!</h1>
      <p id="user-display">You are successfully authenticated.</p>
      <div class="alert alert-success">Authentication verified via email-auth-kit.</div>
      <button type="button" id="logout-btn" style="background: #ef4444; margin-top: 16px;">Sign Out</button>
    </div>
  </div>

  <script>
    const emailForm = document.getElementById("email-form");
    const otpForm = document.getElementById("otp-form");
    const authFlow = document.getElementById("auth-flow");
    const dashboard = document.getElementById("dashboard");
    const alertBox = document.getElementById("alert-box");
    const emailInput = document.getElementById("email");
    const otpInput = document.getElementById("otp");
    const userDisplay = document.getElementById("user-display");

    let currentEmail = "";

    function showAlert(msg, isError = false) {
      alertBox.textContent = msg;
      alertBox.className = "alert " + (isError ? "alert-error" : "alert-success");
      alertBox.classList.remove("hidden");
    }

    function clearAlert() {
      alertBox.classList.add("hidden");
    }

    emailForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();
      currentEmail = emailInput.value.trim();
      const btn = document.getElementById("send-btn");
      btn.disabled = true;
      btn.textContent = "Sending code...";

      try {
        const res = await fetch("/api/auth/otp/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: currentEmail })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to dispatch code.");

        showAlert(data.message || "Code sent to your inbox!");
        emailForm.classList.add("hidden");
        otpForm.classList.remove("hidden");
        otpInput.focus();
      } catch (err) {
        showAlert(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Send One-Time Code";
      }
    });

    otpForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();
      const code = otpInput.value.trim();
      const btn = document.getElementById("verify-btn");
      btn.disabled = true;
      btn.textContent = "Verifying...";

      try {
        const res = await fetch("/api/auth/otp/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: currentEmail, code })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Invalid code.");
        }

        authFlow.classList.add("hidden");
        dashboard.classList.remove("hidden");
        userDisplay.textContent = "Signed in as: " + data.email;
      } catch (err) {
        showAlert(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Verify & Continue";
      }
    });

    document.getElementById("change-email-btn").addEventListener("click", () => {
      clearAlert();
      otpForm.classList.add("hidden");
      emailForm.classList.remove("hidden");
    });

    document.getElementById("resend-btn").addEventListener("click", async () => {
      clearAlert();
      try {
        const res = await fetch("/api/auth/otp/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: currentEmail })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showAlert("A fresh code has been sent!");
      } catch (err) {
        showAlert(err.message, true);
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      dashboard.classList.add("hidden");
      authFlow.classList.remove("hidden");
      otpForm.classList.add("hidden");
      emailForm.classList.remove("hidden");
      emailInput.value = "";
      otpInput.value = "";
      clearAlert();
    });
  </script>
</body>
</html>
